# Runs on every pull request to main. The ruleset on main requires the "check" job to pass
# before a pull request can be merged. Never use pull_request_target here: this workflow
# runs code from the pull request and must never see secrets.
name: Check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      # Lints shadcn's own v4 app and registry code at a pinned commit and compares the reports with the
      # reviewed list in packages/eslint/test/shadcn-corpus.txt. The script fetches the public
      # repository without credentials into a temporary folder; nothing is vendored.
      - run: npm run corpus --workspace packages/eslint
      - run: npm run build
